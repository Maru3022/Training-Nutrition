name: Java CI/CD with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for infrastructure to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker exec postgres-1 pg_isready -U myuser -d mydatabase; do sleep 2; done'
          echo "Waiting for Kafka..."
          timeout 60 bash -c 'until docker exec kafka-1 kafka-topics --bootstrap-server localhost:9092 --list; do sleep 2; done'
          echo "Waiting for Elasticsearch..."
          timeout 60 bash -c 'until curl -s http://localhost:9200 > /dev/null; do sleep 2; done'
          echo "All services ready!"

      - name: Build & Test
        run: mvn clean verify -Ptest --batch-mode
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6381

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v

  docker-build:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t training-nutrition:${{ github.sha }} .
          docker tag training-nutrition:${{ github.sha }} training-nutrition:latest

      - name: Test Docker image
        run: |
          docker run --rm training-nutrition:${{ github.sha }} --version || true

  security-scan:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'Training-Nutrition'
          path: '.'
          format: 'HTML'
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/