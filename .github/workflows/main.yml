name: 🚀 CI/CD Pipeline — Training & Nutrition Platform

on:
  push:
    branches: [ "main", "develop" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy target'
        required: true
        default: 'staging'
        type: choice
        options: [ staging, production ]
      skip_tests:
        description: 'Skip tests (emergency deploy)'
        type: boolean
        default: false

env:
  JAVA_VERSION: '21'
  IMAGE_NAME: training-nutrition
  REGISTRY: ghcr.io
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/training-nutrition

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# ─────────────────────────────────────────────
jobs:

  # ══════════════════════════════════════════════
  # JOB 1 — Build & Unit Tests (matrix: JDK versions)
  # ══════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    if: ${{ !inputs.skip_tests }}

    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '22' ]

    outputs:
      jar-name: ${{ steps.meta.outputs.jar }}
      version:  ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for SonarQube blame

      - name: ☕ Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: 📦 Cache Maven + SonarQube
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.sonar/cache
          key: ${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-jdk${{ matrix.java }}-

      - name: 🐳 Start infrastructure
        run: |
          docker compose -f docker-compose.ci.yml up -d
          echo "Waiting for services..."
          timeout 90 bash -c '
            until docker exec postgres-1 pg_isready -U myuser -d mydatabase 2>/dev/null; do sleep 2; done
            until docker exec kafka-1   kafka-topics --bootstrap-server localhost:9092 --list 2>/dev/null; do sleep 2; done
            until curl -sf http://localhost:9200/_cluster/health; do sleep 2; done
          '
          echo "✅ All services ready"

      - name: 🧪 Build & Test
        id: build
        run: |
          mvn clean verify -Ptest \
            --batch-mode \
            --no-transfer-progress \
            -Dsurefire.failIfNoSpecifiedTests=false
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6381

      - name: 📊 Test summary
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit — JDK ${{ matrix.java }}
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: 📈 JaCoCo coverage report
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 75
          min-coverage-changed-files: 80

      - name: 🏷️ Extract metadata
        id: meta
        run: |
          VER=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          JAR=$(ls target/*.jar | head -1 | xargs basename)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR"     >> "$GITHUB_OUTPUT"

      - name: ⬆️ Upload JAR (JDK 21 only)
        if: matrix.java == '21'
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7

      - name: ⬆️ Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-jdk${{ matrix.java }}
          path: |
            target/surefire-reports/
            target/site/jacoco/

      - name: 🛑 Stop infrastructure
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # ══════════════════════════════════════════════
  # JOB 2 — Code Quality (SonarQube + Checkstyle)
  # ══════════════════════════════════════════════
  code-quality:
    name: 🔍 Code Quality
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: ⬇️ Download test results
        uses: actions/download-artifact@v4
        with:
          name: test-results-jdk21
          path: target/

      - name: 🔎 SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=training-nutrition \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            --batch-mode --no-transfer-progress

      - name: ✅ SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: 📋 Checkstyle
        run: mvn checkstyle:check --batch-mode --no-transfer-progress

  # ══════════════════════════════════════════════
  # JOB 3 — Security Scan (OWASP + Trivy + Semgrep)
  # ══════════════════════════════════════════════
  security-scan:
    name: 🛡️ Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 🔐 OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: Training-Nutrition
          path: .
          format: SARIF
          out: reports
          args: >
            --failOnCVSS 7
            --enableRetired
            --nvdApiKey ${{ secrets.NVD_API_KEY }}

      - name: 📤 Upload OWASP SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/dependency-check-report.sarif

      - name: 🦠 Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/java
            p/spring
            p/owasp-top-ten
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: ⬆️ Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: reports/
          retention-days: 30

  # ══════════════════════════════════════════════
  # JOB 4 — Docker Build & Push (multi-arch)
  # ══════════════════════════════════════════════
  docker-build:
    name: 🐳 Docker Build & Push
    needs: [ code-quality, security-scan ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      image-tag:    ${{ steps.docker-meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: ⬇️ Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: 🏗️ Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🚢 Build & Push (linux/amd64 + linux/arm64)
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 🔍 Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY_IMAGE }}:sha-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: 📤 Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ══════════════════════════════════════════════
  # JOB 5 — Deploy to Staging
  # ══════════════════════════════════════════════
  deploy-staging:
    name: 🌿 Deploy → Staging
    needs: docker-build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.training-nutrition.app

    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Deploy to Staging (Helm)
        run: |
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          helm upgrade --install training-nutrition ./helm \
            --namespace staging \
            --create-namespace \
            --set image.tag=sha-${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY_IMAGE }} \
            --set replicaCount=2 \
            --set ingress.host=staging.training-nutrition.app \
            --atomic \
            --timeout 5m

      - name: 🏥 Health check
        run: |
          timeout 120 bash -c '
            until curl -sf https://staging.training-nutrition.app/actuator/health | grep -q "UP"; do
              echo "Waiting for health check..."; sleep 5
            done
          '
          echo "✅ Staging is healthy"

  # ══════════════════════════════════════════════
  # JOB 6 — Integration Tests (against staging)
  # ══════════════════════════════════════════════
  integration-tests:
    name: 🧩 Integration Tests
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 🔗 Run Integration Tests
        run: |
          mvn verify -Pintegration-test \
            --batch-mode \
            --no-transfer-progress \
            -Dtest.target.url=https://staging.training-nutrition.app
        env:
          SPRING_PROFILES_ACTIVE: integration

      - name: 🌐 Playwright E2E Tests
        uses: microsoft/playwright-github-action@v1

      - name: Run E2E
        run: npx playwright test --reporter=html
        working-directory: e2e/

      - name: ⬆️ Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: e2e/playwright-report/

  # ══════════════════════════════════════════════
  # JOB 7 — Performance Benchmark (k6)
  # ══════════════════════════════════════════════
  performance:
    name: ⚡ Performance Benchmark
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 📊 Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load-test.js
          flags: --out json=k6-results.json
        env:
          K6_BASE_URL: https://staging.training-nutrition.app

      - name: 📈 Parse & assert SLOs
        run: |
          python3 scripts/assert-slos.py k6-results.json \
            --p95-threshold 500 \
            --error-rate-threshold 0.01

      - name: ⬆️ Upload k6 report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-performance-report
          path: k6-results.json

  # ══════════════════════════════════════════════
  # JOB 8 — Canary Deploy to Production
  # ══════════════════════════════════════════════
  deploy-production-canary:
    name: 🐦 Canary → Production (10%)
    needs: [ integration-tests, performance ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production-canary
      url: https://training-nutrition.app

    steps:
      - uses: actions/checkout@v4

      - name: 🐦 Canary rollout (10% traffic)
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          helm upgrade --install training-nutrition-canary ./helm \
            --namespace production \
            --set image.tag=sha-${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY_IMAGE }} \
            --set canary.enabled=true \
            --set canary.weight=10 \
            --atomic \
            --timeout 5m

      - name: ⏳ Monitor canary (5 min)
        run: |
          sleep 300
          # Check error rate in Prometheus/Grafana
          ERROR_RATE=$(curl -sf "${{ secrets.PROMETHEUS_URL }}/api/v1/query" \
            --data-urlencode 'query=rate(http_server_requests_seconds_count{status=~"5..",version="canary"}[5m])' \
            | jq '.data.result[0].value[1] // "0"' -r)
          echo "Canary error rate: $ERROR_RATE"
          if (( $(echo "$ERROR_RATE > 0.01" | bc -l) )); then
            echo "❌ Error rate too high — rolling back"
            exit 1
          fi
          echo "✅ Canary healthy"

  # ══════════════════════════════════════════════
  # JOB 9 — Full Production Rollout
  # ══════════════════════════════════════════════
  deploy-production:
    name: 🚀 Full Rollout → Production
    needs: deploy-production-canary
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://training-nutrition.app

    steps:
      - uses: actions/checkout@v4

      - name: 🚀 Full production deploy
        run: |
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > kubeconfig
          export KUBECONFIG=kubeconfig
          helm upgrade --install training-nutrition ./helm \
            --namespace production \
            --set image.tag=sha-${{ github.sha }} \
            --set image.repository=${{ env.REGISTRY_IMAGE }} \
            --set replicaCount=4 \
            --set canary.enabled=false \
            --set ingress.host=training-nutrition.app \
            --set resources.requests.memory=512Mi \
            --set resources.limits.memory=1Gi \
            --atomic \
            --timeout 10m

      - name: 🏷️ Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/*.jar

      - name: 🔔 Notify Slack — success
        if: success()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "✅ *${{ github.repository }}* deployed to production\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nURL: https://training-nutrition.app"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 🔔 Notify Slack — failure
        if: failure()
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "❌ *${{ github.repository }}* production deploy FAILED\nCommit: `${{ github.sha }}`\nAuthor: ${{ github.actor }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}