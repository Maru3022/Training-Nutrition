name: Java CI/CD with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Infrastructure (Docker Compose)
        run: docker-compose -f compose.yaml up -d

      - name: Wait for Services
        run: |
          echo "Waiting for services to be ready..."
          # Увеличил время до 40с, так как Elastic и Kafka в облаке поднимаются не сразу
          sleep 40 

      - name: Build and Test with Maven
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/mydatabase
          SPRING_DATA_REDIS_PORT: 6381
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Stop Infrastructure
        if: always()
        run: docker-compose -f compose.yaml down

  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          mvn clean package -DskipTests
          # Замени 'your-username' на свой логин в Docker Hub
          docker build -t your-username/nutrition-tips:latest .
          docker push your-username/nutrition-tips:latest