name: Java CI/CD Professional

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: '21'

jobs:
  # 1. Сборка и Тесты
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: 🧪 Run Unit Tests
        run: ./mvnw -B clean test -Dspring.profiles.active=test

      - name: 🏗️ Build Package
        run: ./mvnw -B clean package -DskipTests

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  # 2. Качество кода (зависит от сборки)
  code-quality:
    name: 🔍 Code Quality
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 OWASP Dependency Check
        shell: bash
        run: echo "Running security scan... (imitation)" && sleep 5
      # Тут можно добавить реальный SonarQube или Checkstyle

  # 3. Docker (зависит от качества кода)
  docker-build-push:
    name: 🐳 Docker Build & Push
    needs: code-quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push
        run: |
          echo "Building image for ${{ github.repository }}..."
          # Реальные команды docker build & push здесь

  # 4. Деплой на Стейджинг (только из develop)
  deploy-staging:
    name: 🧪 Deploy to Staging
    needs: docker-build-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: 🚀 SSH Deploy
        run: echo "Deploying to Staging Server..."

  # 5. Интеграционные тесты (после стейджинга)
  integration-tests:
    name: 🔗 Integration Tests
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: 🔗 Run IT
        run: echo "Running tests against Staging URL..."

  # 6. Деплой в Продакшн (только из main)
  deploy-production:
    name: 🚀 Deploy to Production
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 🚀 SSH Deploy
        run: |
          echo "Deploying to http://trains-service.example.com"
          sleep 7

  # 7. Уведомление для develop после staging-цепочки
  notify-staging:
    name: 📣 Notify Staging
    needs: integration-tests
    if: always() && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: 📣 Send Slack/Telegram Notification
        run: echo "Staging deployment status sent!"

  # 8. Уведомление для main после production-цепочки
  notify-production:
    name: 📣 Notify Production
    needs: deploy-production
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📣 Send Slack/Telegram Notification
        run: echo "Production deployment status sent!"