name: Java CI with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start infrastructure
        run: docker compose up -d

      - name: Wait for PostgreSQL
        run: |
          timeout 60s bash -c 'until pg_isready -h localhost -p 5434 -U myuser; do sleep 3; done'

      - name: Wait for Elasticsearch
        run: |
          timeout 120s bash -c 'until curl -s http://localhost:9200 >/dev/null; do sleep 5; done'

      - name: Wait for Kafka
        run: |
          timeout 120s bash -c 'until nc -z localhost 9094; do sleep 5; done'

      - name: Build & Test
        run: mvn clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/mydatabase
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_DATA_REDIS_PORT: 6381

      - name: Stop infrastructure
        if: always()
        run: docker compose down -v
