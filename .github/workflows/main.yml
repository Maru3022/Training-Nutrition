name: Java CI/CD with Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Start Infrastructure
        run: docker compose up -d

      - name: Wait for Services (Healthcheck)
        # Эта команда будет ждать, пока все сервисы с пометкой healthcheck станут 'healthy'
        run: |
          echo "Waiting for Elasticsearch and Postgres to be ready..."
          # Если команда wait не поддерживается старым docker, используем цикл:
          timeout 120s bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} elasticsearch-1)" == "healthy" ]; do sleep 5; done'
          echo "Services are ready!"

      - name: Build and Test with Maven
        run: mvn clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/mydatabase
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9094
          SPRING_ELASTICSEARCH_URIS: http://localhost:9200
          SPRING_DATA_REDIS_PORT: 6381

      - name: Stop Infrastructure
        if: always()
        run: docker compose down