name: CI/CD (main)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 🔧 Make mvnw executable
        shell: bash
        run: chmod +x mvnw

      - name: 🧪 Run Unit Tests
        run: ./mvnw -B clean test -Dspring.profiles.active=test

      - name: 🏗️ Build Package
        run: ./mvnw -B clean package -DskipTests

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  code-quality:
    name: 🔍 Code Quality
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 OWASP Dependency Check
        shell: bash
        run: echo "Running security scan... (imitation)" && sleep 5

  docker-build-push:
    name: 🐳 Docker Build & Push
    needs: code-quality
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🐳 Build and Push Docker Image
        run: |
          IMAGE_NAME="${{ secrets.DOCKER_USERNAME }}/nutrition-service:latest"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

  deploy-kubernetes:
    name: 🚀 Deploy to Kubernetes
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: production # Используйте соответствующую среду
    steps:
      - uses: actions/checkout@v4
      - name: 📥 Download JAR
        uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/
      - name: 🚀 Set up Kubeconfig
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      - name: 🔐 Configure Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
      - name: 📦 Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

  deploy-production:
    name: 🚀 Deploy to Production (Legacy)
    needs: deploy-kubernetes # Изменено на зависимость от нового шага развертывания Kubernetes
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 🚀 SSH Deploy
        run: |
          echo "Deploying to http://trains-service.example.com (This step can be removed if Kubernetes is fully adopted)"
          sleep 7

  notify-production:
    name: 📣 Notify Production
    needs: deploy-production
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📣 Send Slack/Telegram Notification
        run: echo "Production deployment status sent!"
