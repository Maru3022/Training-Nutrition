name: CI/CD (develop)

on:
  push:
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: "21"

jobs:
  build-and-test:
    name: 🔨 Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: 🔧 Make mvnw executable
        shell: bash
        run: chmod +x mvnw

      - name: 🧪 Run Unit Tests
        run: ./mvnw -B clean test -Dspring.profiles.active=test

      - name: 🏗️ Build Package
        run: ./mvnw -B clean package -DskipTests

      - name: 📤 Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

  code-quality:
    name: 🔍 Code Quality
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 🔐 OWASP Dependency Check
        shell: bash
        run: echo "Running security scan... (imitation)" && sleep 5

  docker-build-push:
    name: 🐳 Docker Build & Push
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application-jar
          path: target/

      - name: 🔑 Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and Push
        run: |
          echo "Building image for ${{ github.repository }}..."
          # Реальные команды docker build & push здесь

  deploy-staging:
    name: 🧪 Deploy to Staging
    needs: docker-build-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: 🚀 SSH Deploy
        run: echo "Deploying to Staging Server..."

  integration-tests:
    name: 🔗 Integration Tests
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: 🔗 Run IT
        run: echo "Running tests against Staging URL..."

  notify-staging:
    name: 📣 Notify Staging
    needs: integration-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📣 Send Slack/Telegram Notification
        run: echo "Staging deployment status sent!"
