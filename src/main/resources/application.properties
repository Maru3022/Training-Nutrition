# --- General ---
spring.application.name=Training-Nutrition
server.port=8083

# --- Docker Compose Management ---
# ??????????: ?????????? NEVER ?????? false
spring.docker.compose.readiness.wait=NEVER
spring.docker.compose.file=compose.yaml

# --- PostgreSQL (JPA & Hibernate) ---
spring.datasource.url=jdbc:postgresql://localhost:5434/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hikari Connection Pool
spring.datasource.hikari.maximum-pool-size=200
spring.datasource.hikari.minimum-idle=20

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6381

# --- Elasticsearch ---
spring.elasticsearch.uris=http://localhost:9200
spring.elasticsearch.socket-timeout=30s
spring.elasticsearch.rest.connection-timeout=10s
spring.elasticsearch.rest.read-timeout=30s

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=nutrition-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Swagger / OpenAPI (SpringDoc) ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Server Optimization ---
server.tomcat.threads.max=1000
server.tomcat.max-connections=20000
server.tomcat.accept-count=2000

# --- Logging ---
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.org.springframework.kafka=INFO