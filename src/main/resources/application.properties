# --- ???????? ????????? ---
spring.application.name=Training-Nutrition
server.port=8083

# --- PostgreSQL (JPA & Hibernate) ---
spring.datasource.url=jdbc:postgresql://localhost:5434/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
# update ????????????? ???????/????????? ??????? ?? ?????? Entity ???????
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Redis (????????? ???? 6381) ---
spring.data.redis.host=localhost
spring.data.redis.port=6381

# --- Elasticsearch ---
spring.elasticsearch.uris=http://localhost:9200
# ????????? ???????? SSL ??? ????????? ?????????? (??? ??? ? Docker xpack.security.enabled=false)
spring.elasticsearch.socket-timeout=30s

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
# ????????? Consumer (??? ?? ?????? ?????????)
spring.kafka.consumer.group-id=nutrition-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# ???????? ???? ??????? ??? ?????????????? JSON
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# ????????? Producer (??? ?? ?????????? ?????????)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# --- Swagger / OpenAPI (SpringDoc) ---
# ???????????? ????? ???????? ?? ??????: http://localhost:8083/swagger-ui/index.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging ---
logging.level.org.springframework.data.elasticsearch=DEBUG
logging.level.org.springframework.kafka=INFO