<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>IRON NUTRITION | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #ff0000; --dark-bg: #0a0a0a; --card-bg: #1a1a1a; --neon-glow: 0 0 15px rgba(255, 0, 0, 0.7); }
        body { background-color: var(--dark-bg); color: white; font-family: 'Roboto', sans-serif; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 900px; padding: 40px 20px; }
        h1 { font-family: 'Orbitron', sans-serif; color: var(--primary-red); text-shadow: var(--neon-glow); border-left: 8px solid var(--primary-red); padding-left: 20px; text-transform: uppercase; margin-bottom: 50px; }
        section { background: var(--card-bg); padding: 30px; margin-bottom: 40px; border: 1px solid #333; border-radius: 4px; }
        .input-group { display: grid; grid-template-columns: 2fr 1fr auto; gap: 15px; }
        input { background: #222; border: 1px solid #444; padding: 15px; color: white; outline: none; }
        button { background: var(--primary-red); color: white; border: none; padding: 15px 30px; font-weight: 900; text-transform: uppercase; cursor: pointer; font-family: 'Orbitron'; transition: 0.2s; }
        .tip-card { background: #111; border-left: 4px solid var(--primary-red); padding: 20px; margin-top: 15px; }
    </style>
</head>
<body>
<div class="container">
    <h1>IRON NUTRITION</h1>
    <section>
        <h2>⚡ СОВЕТЫ ПО ПИТАНИЮ</h2>
        <button onclick="fetchTips()">ПОЛУЧИТЬ ДАННЫЕ</button>
        <div id="tips-list"></div>
    </section>
    <section>
        <h2>💪 ЛОГ ТРЕНИРОВОЧНОГО ДНЯ</h2>
        <div class="input-group">
            <input type="text" id="meal-name" placeholder="ЧТО СЪЕЛ?">
            <input type="number" id="calories" placeholder="ККАЛ">
            <button onclick="saveMeal()">ДОБАВИТЬ</button>
        </div>
        <p id="status-msg"></p>
    </section>
</div>

<script>
    const API_BASE = "http://localhost:8083/api/v1";

    async function fetchTips() {
        const listDiv = document.getElementById('tips-list');
        listDiv.innerHTML = "<p>ЗАГРУЗКА...</p>";
        try {
            const response = await fetch(`${API_BASE}/tips`);
            const tips = await response.json();
            listDiv.innerHTML = tips.map(tip => `
                <div class="tip-card">
                    <strong>${tip.title}</strong>
                    <p>${tip.content}</p>
                </div>
            `).join('');
        } catch (err) {
            listDiv.innerHTML = "<p style='color:red'>ОШИБКА СВЯЗИ С БЭКЕНДОМ</p>";
        }
    }

    async function saveMeal() {
        const title = document.getElementById('meal-name').value;
        const cals = document.getElementById('calories').value;
        const msg = document.getElementById('status-msg');
        if(!title || !cals) { msg.innerText = "ЗАПОЛНИ ПОЛЯ!"; return; }
        try {
            const response = await fetch(`${API_BASE}/tips`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, content: cals + " ккал", category: "USER_LOG" })
            });
            if (response.ok) {
                msg.style.color = "#00ff00";
                msg.innerText = "СОХРАНЕНО!";
            }
        } catch (err) { msg.style.color = "red"; msg.innerText = "СБОЙ!"; }
    }
</script>
</body>
</html>
