# Disable Docker Compose for tests
spring.docker.compose.enabled=false

# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Elasticsearch for tests - must be empty to disable auto-configuration
spring.elasticsearch.uris=
spring.data.elasticsearch.repositories.enabled=false

# Disable Kafka for tests - prevent auto-configuration
spring.kafka.bootstrap-servers=
spring.kafka.consumer.auto-startup=false
spring.kafka.producer.auto-startup=false
spring.autoconfigure.exclude=org.springframework.kafka.autoconfigure.KafkaAutoConfiguration

# Disable Redis for tests
spring.data.redis.repositories.enabled=false
spring.autoconfigure.exclude=${spring.autoconfigure.exclude:},org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Disable caching in tests (no Redis available)
spring.cache.type=none