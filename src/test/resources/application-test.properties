# Use H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable caching in tests (use simple in-memory cache)
spring.cache.type=simple

# Disable Elasticsearch completely for tests
app.elasticsearch.enabled=false

# Empty Elasticsearch URIs (auto-config excluded in test class)
spring.elasticsearch.uris=

# Kafka disabled (auto-config excluded in test class)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.auto-startup=false
spring.kafka.producer.auto-startup=false
